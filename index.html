<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0807">
  <title>Salon des Jeux VR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0807; }
    body { font-family: 'Nunito', system-ui, sans-serif; color: #f3e6c8; touch-action: none; }
    canvas { display: block; }
    #card {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      width: min(420px, calc(100% - 32px)); box-sizing: border-box;
      padding: 16px 18px 14px; border-radius: 18px; text-align: center;
      background: rgba(14, 11, 12, 0.82); border: 1px solid rgba(216, 178, 90, 0.45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    #card h1 {
      margin: 0 0 10px; font: 700 24px 'Cinzel', Georgia, serif; letter-spacing: 0.04em;
      background: linear-gradient(#fbe7a9, #c9a24a); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #vr {
      font: 800 17px 'Nunito', sans-serif; color: #1b140c; cursor: pointer;
      padding: 12px 26px; border: 0; border-radius: 999px;
      background: linear-gradient(#f3d58a, #c99a43); box-shadow: 0 4px 18px rgba(216, 178, 90, 0.35);
    }
    #vr:disabled { cursor: default; color: rgba(243, 230, 200, 0.7); background: rgba(255, 255, 255, 0.08); box-shadow: none; }
    #vr-note { margin: 10px 0 0; font-size: 13px; line-height: 1.4; color: rgba(243, 230, 200, 0.7); }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; background: #0b0807;
      font: 600 18px 'Cinzel', Georgia, serif; color: #d8b25a; letter-spacing: 0.08em; transition: opacity 0.6s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="card">
    <h1>Salon des Jeux</h1>
    <button id="vr" disabled>Recherche du casque…</button>
    <p id="vr-note">Hors casque : glissez pour regarder autour, touchez pour choisir.</p>
  </div>
  <div id="loading">Préparation du salon…</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
